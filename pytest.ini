[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
filterwarnings =
    ignore::DeprecationWarning
markers =
    smoke: end-to-end smoke checks (require real LLM keys, skipped in CI)
    stealth: scraper/anti-detect tests (slow)
